# SonarCloud automatic analysis settings.
#
# The test fixture directories hold throwaway keys, certificates and key stores that other tools
# (OpenSSL, keytool, .NET) wrote for the tests to read, and the script that regenerates them. Each
# key is trusted nowhere else, and some stores are written with legacy algorithms on purpose, to
# test that they are read or refused. They are data, not code: leave them out of analysis.
sonar.exclusions=packages/*/test-fixtures/**,packages/*/testdata/**
