# Reusable check workflow, called by ci.yml (every push and pull request) and release.yml (version
# tags), so a release is checked exactly as CI checks every commit - there is one definition of
# "the build", not two.
#
# Runs scripts/check.sh - the same script a developer runs - on each supported OS: a clean npm ci
# (which compiles the native add-ons with that OS's C toolchain - securefile's on Windows only), a
# forced build that type-checks every platform's loader, every package's tests, npm audit of the
# runtime dependencies, and a dry-run pack of every published package. The native round trips are
# reported as skipped on GitHub's runners, which have no HkdfGuard native library installed; a
# self-hosted runner with a provisioned test service runs them too. So are the AWS KMS integration
# tests, which need HKDFGUARD_TEST_AWS_KMS_KEY_ID and AWS credentials this workflow doesn't have.
#
# Holds no secrets and needs no write permission.
name: Build

on:
  workflow_call:

permissions:
  contents: read

# Third-party actions are pinned to full commit SHAs; see release.yml.

jobs:
  check:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false # nothing later in this job pushes

      # .nvmrc names the Node.js major version; package-lock.json keys the npm cache.
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          check-latest: false
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Check every package
        shell: bash
        run: scripts/check.sh
